<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Node Lifecycle Dashboard</title>
  <style>
    :root {
      /* Surfaces */
      --bg-page:      #F1F5FA;
      --bg-primary:   #FFFFFF;
      --bg-secondary: #E8EDF6;
      --bg-tertiary:  #D4DAE8;

      /* Status */
      --bg-success: #D1FAE5;
      --bg-warning: #FEF3C7;
      --bg-danger:  #FFE4E6;
      --bg-info:    #DBEAFE;

      /* Text */
      --text-primary:   #0C1425;
      --text-secondary: #455A78;
      --text-tertiary:  #8EA4BC;
      --text-success:   #065F46;
      --text-warning:   #92400E;
      --text-danger:    #9F1239;
      --text-info:      #1E40AF;

      /* Structure */
      --border-color: rgba(12, 20, 37, 0.09);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", "Roboto Mono", Consolas, "Courier New", monospace;
      --radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page:      #07101E;
        --bg-primary:   #0F1C30;
        --bg-secondary: #172538;
        --bg-tertiary:  #1E2F48;

        --bg-success: #052E16;
        --bg-warning: #451A03;
        --bg-danger:  #4C0519;
        --bg-info:    #0C2A4E;

        --text-primary:   #DDE9F8;
        --text-secondary: #7898BB;
        --text-tertiary:  #3D5E82;
        --text-success:   #34D399;
        --text-warning:   #FBBF24;
        --text-danger:    #F87171;
        --text-info:      #60A5FA;

        --border-color: rgba(220, 233, 248, 0.08);
      }
    }

    * { box-sizing: border-box; }
    h1, h2 { margin: 0; font-weight: inherit; }

    body {
      margin: 0;
      padding: 2.5rem 2rem 5rem;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1040px; margin: 0 auto; }

    /* ── Header ──────────────────────────────────────── */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      margin-bottom: 2.25rem;
    }

    .header-title { flex: 1; min-width: 0; }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0;
    }

    .generated-at {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      padding-top: 7px;
      flex-shrink: 0;
    }

    /* ── Section label ───────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin: 2.5rem 0 1rem;
    }

    .two-col .section-label { margin-top: 0; }

    /* ── Metrics ─────────────────────────────────────── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .metric-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .metric-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-tertiary);
      margin: 0 0 0.65rem;
    }

    .metric-value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin: 0 0 6px;
      font-family: var(--font-mono);
      line-height: 1;
    }

    .metric-sub {
      font-size: 12px;
      color: var(--text-tertiary);
      margin: 0;
    }

    /* ── Pipeline ────────────────────────────────────── */
    .pipeline {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .pipeline-cell {
      flex: 1;
      min-width: 92px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 14px 10px 12px;
      text-align: center;
    }

    .pipeline-count {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .pipeline-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 6px;
    }

    /* ── Chart ───────────────────────────────────────── */
    .chart-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 180px;
    }

    /* ── Two-col ─────────────────────────────────────── */
    .two-col {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      margin-top: 2.5rem;
    }

    /* ── Tickets ─────────────────────────────────────── */
    .ticket-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 12px;
      margin-bottom: 6px;
      transition: border-color 0.15s;
    }

    .ticket-row:hover { border-color: var(--text-tertiary); }

    .ticket-main { min-width: 0; }

    .ticket-id {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-primary);
    }

    .ticket-node { color: var(--text-tertiary); }

    .ticket-issue {
      color: var(--text-secondary);
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ticket-meta { text-align: right; flex-shrink: 0; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      display: inline-block;
      letter-spacing: 0.01em;
    }

    .ticket-sla {
      color: var(--text-tertiary);
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    /* ── Datacenter ──────────────────────────────────── */
    .dc-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 8px;
    }

    .dc-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .dc-header span:last-child {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .dc-bar-track {
      height: 5px;
      background: var(--bg-tertiary);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .dc-bar-fill {
      height: 100%;
      background: var(--text-info);
      border-radius: 3px;
    }

    .dc-issues {
      font-size: 11px;
      color: var(--text-tertiary);
      line-height: 1.65;
    }

    /* ── Node table ──────────────────────────────────── */
    .node-table-header {
      display: grid;
      grid-template-columns: 90px 1fr 70px 110px 90px;
      gap: 8px;
      padding: 0 12px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 6px;
    }

    .node-row {
      display: grid;
      grid-template-columns: 90px 1fr 70px 110px 90px;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      font-size: 12px;
      border-radius: var(--radius);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      margin-bottom: 4px;
      transition: border-color 0.15s;
    }

    .node-row:hover { border-color: var(--text-tertiary); }

    .node-id { font-family: var(--font-mono); font-weight: 600; }
    .node-loc { color: var(--text-secondary); }
    .node-gpu { color: var(--text-tertiary); font-size: 11px; }
    .node-hours {
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: right;
      color: var(--text-tertiary);
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 640px) {
      body { padding: 1.5rem 1rem 4rem; }
      h1 { font-size: 24px; }
      .page-header { flex-direction: column; gap: 0.25rem; }
      .generated-at { padding-top: 0; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
      .node-table-header { display: none; }
      .node-row {
        grid-template-columns: 80px 1fr 90px;
        grid-template-areas: "id state hours" "loc loc loc";
      }
      .node-id { grid-area: id; }
      .node-loc { grid-area: loc; }
      .node-gpu { display: none; }
      .node-state { grid-area: state; }
      .node-hours { grid-area: hours; }
    }
  </style>
</head>

  <div class="container">

    <header class="page-header">
      <div class="header-title">
        <h1>Fleet node lifecycle</h1>
        <p class="subtitle">GPU fleet health and repair tracking across 2 datacenters</p>
      </div>
      <span id="generatedAt" class="generated-at"></span>
    </header>

    <div class="metrics-grid" id="metricsGrid"></div>

    <h2 class="section-label">Node lifecycle pipeline</h2>
    <div class="pipeline" id="pipeline"></div>

    <h2 class="section-label">GPU-hours lost to downtime, last 30 days</h2>
    <div class="chart-card">
      <div class="chart-wrap">
        <canvas
          id="lossChart"
          role="img"
          aria-label="Line chart showing GPU hours lost per day over the last 30 days"
        ></canvas>
      </div>
    </div>

    <div class="two-col">
      <div>
        <h2 class="section-label">Open tickets by SLA status</h2>
        <div id="ticketList"></div>
      </div>
      <div>
        <h2 class="section-label">Datacenter breakdown</h2>
        <div id="dcSummary"></div>
      </div>
    </div>

    <h2 class="section-label">Nodes requiring attention</h2>
    <div class="node-table-header">
      <span>Node</span>
      <span>Location / Rack</span>
      <span>GPU</span>
      <span>State</span>
      <span style="text-align:right">In stage</span>
    </div>
    <div id="nodeTable"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const data = JSON.parse(document.getElementById('dashboard-data').textContent);

    const STAGE_ORDER = [
      'HEALTHY', 'DEGRADED', 'DOWN', 'TICKETED',
      'IN_REPAIR', 'REPAIRED', 'REINTEGRATING', 'DECOMMISSIONED',
    ];

    const STAGE_LABELS = {
      HEALTHY: 'Healthy',
      DEGRADED: 'Degraded',
      DOWN: 'Down',
      TICKETED: 'Ticketed',
      IN_REPAIR: 'In repair',
      REPAIRED: 'Repaired',
      REINTEGRATING: 'Reintegrating',
      DECOMMISSIONED: 'Decommissioned',
    };

    const STAGE_COLORS = {
      HEALTHY: { bg: 'var(--bg-success)', text: 'var(--text-success)' },
      DEGRADED: { bg: 'var(--bg-warning)', text: 'var(--text-warning)' },
      DOWN: { bg: 'var(--bg-danger)', text: 'var(--text-danger)' },
      TICKETED: { bg: 'var(--bg-warning)', text: 'var(--text-warning)' },
      IN_REPAIR: { bg: 'var(--bg-warning)', text: 'var(--text-warning)' },
      REPAIRED: { bg: 'var(--bg-info)', text: 'var(--text-info)' },
      REINTEGRATING: { bg: 'var(--bg-info)', text: 'var(--text-info)' },
      DECOMMISSIONED: { bg: 'var(--bg-secondary)', text: 'var(--text-tertiary)' },
    };

    const TICKET_STATUS_META = {
      breached: { label: 'SLA breached', color: 'var(--text-danger)', bg: 'var(--bg-danger)' },
      at_risk: { label: 'At risk', color: 'var(--text-warning)', bg: 'var(--bg-warning)' },
      on_track: { label: 'On track', color: 'var(--text-success)', bg: 'var(--bg-success)' },
    };

    const TICKET_SORT_ORDER = { breached: 0, at_risk: 1, on_track: 2 };

    function formatAsOf(isoTimestamp) {
      return isoTimestamp.replace('T', ' ').replace('Z', ' UTC');
    }

    function renderTopbar() {
      document.getElementById('generatedAt').textContent =
        'Data as of ' + formatAsOf(data.generated_at);
    }

    function renderMetrics() {
      const totalNodes = Object.values(data.state_distribution).reduce((sum, n) => sum + n, 0);
      const totalGpus = totalNodes * 8;
      const healthy = data.state_distribution.HEALTHY || 0;
      const healthyPct = ((healthy / totalNodes) * 100).toFixed(1);
      const totalCapacityGpuHours = totalGpus * 24 * 30;
      const lossPct = (
        (data.utilization_loss.total_gpu_hours_lost / totalCapacityGpuHours) * 100
      ).toFixed(1);
      const breachedCount = data.open_tickets.filter((t) => t.status === 'breached').length;

      const metrics = [
        { label: 'Fleet size', value: `${totalNodes} nodes`, sub: `${totalGpus} GPUs` },
        {
          label: 'Healthy now',
          value: `${healthy} / ${totalNodes}`,
          sub: `${healthyPct}% of fleet`,
          color: 'var(--text-success)',
        },
        {
          label: 'GPU-hours lost (30d)',
          value: data.utilization_loss.total_gpu_hours_lost.toLocaleString(),
          sub: `${lossPct}% of capacity`,
          color: 'var(--text-danger)',
        },
        {
          label: 'Open tickets',
          value: `${data.open_tickets.length}`,
          sub: `${breachedCount} SLA breached`,
          color: 'var(--text-warning)',
        },
      ];

      const grid = document.getElementById('metricsGrid');
      metrics.forEach((metric) => {
        const card = document.createElement('div');
        card.className = 'metric-card';
        card.innerHTML = `
          <p class="metric-label">${metric.label}</p>
          <p class="metric-value" style="${metric.color ? `color:${metric.color}` : ''}">${metric.value}</p>
          <p class="metric-sub">${metric.sub}</p>
        `;
        grid.appendChild(card);
      });
    }

    function renderPipeline() {
      const pipeline = document.getElementById('pipeline');

      STAGE_ORDER.forEach((stage) => {
        const count = data.state_distribution[stage] || 0;
        const colors = STAGE_COLORS[stage];
        const cell = document.createElement('div');
        cell.className = 'pipeline-cell';
        cell.style.background = colors.bg;
        cell.innerHTML = `
          <div class="pipeline-count" style="color:${colors.text}">${count}</div>
          <div class="pipeline-label" style="color:${colors.text}">${STAGE_LABELS[stage]}</div>
        `;
        pipeline.appendChild(cell);
      });
    }

    function renderTickets() {
      const ticketList = document.getElementById('ticketList');
      const sortedTickets = [...data.open_tickets].sort(
        (a, b) => TICKET_SORT_ORDER[a.status] - TICKET_SORT_ORDER[b.status]
      );

      sortedTickets.forEach((ticket) => {
        const meta = TICKET_STATUS_META[ticket.status];
        const row = document.createElement('div');
        row.className = 'ticket-row';
        row.innerHTML = `
          <div class="ticket-main">
            <div>
              <span class="ticket-id">${ticket.ticket_id}</span>
              <span class="ticket-node">/ ${ticket.node_id}</span>
            </div>
            <div class="ticket-issue">${ticket.issue_summary}</div>
          </div>
          <div class="ticket-meta">
            <span class="badge" style="background:${meta.bg}; color:${meta.color}">${meta.label}</span>
            <div class="ticket-sla">${ticket.elapsed_hours}h / ${ticket.sla_hours}h SLA</div>
          </div>
        `;
        ticketList.appendChild(row);
      });
    }

    function renderDatacenters() {
      const dcSummary = document.getElementById('dcSummary');

      Object.entries(data.datacenter_summary).forEach(([dc, states]) => {
        const total = states._total;
        const healthyCount = states.HEALTHY || 0;
        const pct = Math.round((healthyCount / total) * 100);
        const issues = Object.entries(states).filter(
          ([key]) => key !== 'HEALTHY' && key !== '_total'
        );
        const issueStr = issues
          .map(([state, count]) => `${count} ${STAGE_LABELS[state].toLowerCase()}`)
          .join(', ');

        const card = document.createElement('div');
        card.className = 'dc-card';
        card.innerHTML = `
          <div class="dc-header">
            <span style="font-weight:500">${dc}</span>
            <span>${healthyCount}/${total} healthy</span>
          </div>
          <div class="dc-bar-track">
            <div class="dc-bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="dc-issues">${issueStr || 'No active issues'}</div>
        `;
        dcSummary.appendChild(card);
      });
    }

    function renderNodes() {
      const nodeTable = document.getElementById('nodeTable');
      const sortedNodes = [...data.active_nodes].sort(
        (a, b) => b.hours_in_stage - a.hours_in_stage
      );

      sortedNodes.forEach((node) => {
        const colors = STAGE_COLORS[node.current_state];
        const row = document.createElement('div');
        row.className = 'node-row';
        row.innerHTML = `
          <span class="node-id">${node.node_id}</span>
          <span class="node-loc">${node.datacenter} / ${node.rack}</span>
          <span class="node-gpu">${node.gpu_type}</span>
          <span class="badge node-state" style="background:${colors.bg}; color:${colors.text}; text-align:center">
            ${STAGE_LABELS[node.current_state]}
          </span>
          <span class="node-hours">${node.hours_in_stage}h</span>
        `;
        nodeTable.appendChild(row);
      });
    }

    function renderChart() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const wrap = document.querySelector('.chart-wrap');
      const series = data.utilization_loss.daily_series;

      if (typeof Chart === 'undefined') {
        const minLoss = Math.min(...series.map((d) => d.gpu_hours_lost));
        const maxLoss = Math.max(...series.map((d) => d.gpu_hours_lost));
        wrap.style.height = 'auto';
        wrap.innerHTML = `
          <p style="font-size:12px; color:var(--text-tertiary);">
            Chart could not load (no network access). Daily GPU-hours lost ranged from
            ${minLoss} to ${maxLoss}, trending upward over the final week.
          </p>
        `;
        return;
      }

      new Chart(document.getElementById('lossChart'), {
        type: 'line',
        data: {
          labels: series.map((d) => { const [,m,day] = d.date.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+'-'+day; }),
          datasets: [{
            label: 'GPU-hours lost',
            data: series.map((d) => d.gpu_hours_lost),
            borderColor: '#E24B4A',
            backgroundColor: 'rgba(226, 75, 74, 0.08)',
            fill: true,
            tension: 0.25,
            pointRadius: 0,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              ticks: {
                autoSkip: true,
                maxRotation: 0,
                font: { size: 10 },
                color: isDark ? '#888780' : '#5F5E5A',
              },
              grid: { display: false },
            },
            y: {
              ticks: {
                font: { size: 10 },
                color: isDark ? '#888780' : '#5F5E5A',
              },
              grid: { color: 'rgba(128, 128, 128, 0.1)' },
            },
          },
        },
      });
    }

    renderTopbar();
    renderMetrics();
    renderPipeline();
    renderTickets();
    renderDatacenters();
    renderNodes();
    renderChart();
  </script>
